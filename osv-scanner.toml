# setuptools 81.0.0 -- CVE-2026-59890 / GHSA-h35f-9h28-mq5c (MANIFEST.in
# exclusion bypass via Unicode normalization collision when BUILDING an sdist
# on macOS APFS/HFS+). Not reachable here:
#   * The advisory only affects `sdist` packaging (MANIFEST.in glob matching
#     at build time on normalization-preserving filesystems). We never build
#     sdists at runtime; images are built on Linux (ext4/overlayfs).
#   * setuptools is present solely as the pkg_resources provider for
#     tconnectsync (pyproject pins setuptools <82 because pkg_resources was
#     removed in 82; the fix version 83.0.0 is above that cap).
# Real fix = tconnectsync dropping pkg_resources (or our dropping
# tconnectsync's dep on it); until then the cap blocks the bump.
# ignoreUntil forces re-evaluation.
[[IgnoredVulns]]
id = "GHSA-h35f-9h28-mq5c"
ignoreUntil = 2026-10-25T00:00:00Z
reason = "sdist-build-time MANIFEST.in bypass on macOS filesystems; setuptools here is only the pkg_resources shim for tconnectsync in Linux container images -- no sdist building at runtime. Bump blocked by pyproject cap setuptools<82 (pkg_resources removed in 82, needed by tconnectsync)."
