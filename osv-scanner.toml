# ecdsa -- CVE-2024-23342 / GHSA-wj6h-64fc-37mp ("Minerva" ECDSA timing
# side-channel). NOT EXPLOITABLE in our usage, and no upstream fix exists:
#   * Minerva affects ECDSA signing/keygen only -- NOT verification.
#   * We sign/verify JWTs exclusively with HS256 (HMAC); decode pins
#     algorithms=["HS256"] (no algorithm-confusion path), and no EC algorithms
#     (ES256/384/512) are used anywhere. ecdsa is a dormant transitive dep of
#     python-jose and is never imported on our code path.
#   * python-jose[cryptography] routes any EC op through the constant-time
#     `cryptography` backend, not `ecdsa`.
#   * Upstream is WONTFIX (side channels are out of scope for a pure-Python
#     lib; no patched release exists -- latest 0.19.2 is still flagged).
# Real fix = migrate python-jose -> PyJWT (drops the dep). Tracked in #673.
# ignoreUntil forces re-evaluation (revisit sooner if we ever adopt an
# EC-based JWT algorithm, which would change the exposure).
[[IgnoredVulns]]
id = "GHSA-wj6h-64fc-37mp"
ignoreUntil = 2027-01-01T00:00:00Z
reason = "Not exploitable: HS256/HMAC only, no ECDSA signing; ecdsa is a dormant transitive dep (python-jose[cryptography] uses the cryptography backend). Upstream WONTFIX (no patched release). Real fix = migrate to PyJWT, tracked in #673."

# python-jose -- GHSA-3qf3-8w2g-rqmx (algorithm confusion through a
# DER-encoded asymmetric public key used as an HMAC secret). No patched release
# exists. This path is unreachable in Lumose:
#   * access and refresh token decode explicitly allow only the configured
#     HS256 algorithm (src/core/security.py);
#   * the application secret is a symmetric deployment secret, never an
#     asymmetric public key; and
#   * no RS*/ES* JWT algorithms are configured or accepted.
# Real fix = migrate python-jose -> PyJWT. Tracked in #673.
[[IgnoredVulns]]
id = "GHSA-3qf3-8w2g-rqmx"
ignoreUntil = 2027-01-01T00:00:00Z
reason = "Not exploitable: access and refresh decoders explicitly allow only HS256 and verify with the symmetric application secret; no asymmetric JWT public key or RS*/ES* algorithm enters this path. No patched python-jose release exists; migration to PyJWT is tracked in #673."

# deepmerge 4.3.1 -- GHSA-gcqx-w48m-w2h4 (prototype poisoning in mergeObject()
# when merging attacker-supplied objects). No patched release exists (4.3.1 is
# the latest and is listed as last_affected). Not reachable here:
#   * deepmerge is only a dev dependency, pulled in by jest-config 29.7.0.
#   * jest-config calls it once, in normalize.js, to merge a preset's `globals`
#     with the `globals` from our own apps/web/jest.config.js. Both inputs are
#     repository-authored test configuration, never user or network data.
#   * The production image copies only the Next.js standalone output, so jest
#     and deepmerge never ship.
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-01T00:00:00Z
reason = "No patched deepmerge release. Dev-only via jest-config 29.7.0, which merges globals from the repository's own jest.config.js (normalize.js); no untrusted input reaches it and it is not in the production image."

# minimatch 3.1.5 and 5.1.9 -- GHSA-g3hv-75wg-m249 (globParts amplification in
# firstPhasePreProcess() when optimizationLevel >= 2). The advisory range starts
# at 0, but those two lines do not contain the vulnerable code: there is no
# firstPhasePreProcess() or optimizationLevel in either package (checked in
# node_modules). The 10.x copies that do have it are gone: glob is pinned to
# 14.x under @sentry/bundler-plugins (which brings minimatch 11) and minimatch
# is pinned to 11.x under @typescript-eslint/typescript-estree, both in
# apps/web/package.json. The remaining copies are dev-only (eslint 9 and its
# plugins via minimatch@3, openapi-typescript via @redocly/openapi-core, which
# pins minimatch 5.1.9) and only match repository-authored lint config and file
# paths. Those consumers call minimatch as a function; the callable export was
# dropped in minimatch 9, so forcing the fixed 11.x line on them would break them.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-01T00:00:00Z
reason = "Only minimatch 3.1.5 and 5.1.9 remain (10.x copies replaced by 11.x). Neither contains firstPhasePreProcess()/optimizationLevel, the vulnerable code; both are dev-only (eslint, openapi-typescript) on repository-authored patterns, and they need the callable export that minimatch 9+ (including the fixed 11.x) no longer has."
