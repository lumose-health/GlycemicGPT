# OSV-Scanner configuration
# https://google.github.io/osv-scanner/configuration/

# Suppress known false positives or accepted risks here.
# Each entry requires a reason explaining why it's safe to ignore.
# Review suppressions quarterly.

# ecdsa -- CVE-2024-23342 / GHSA-wj6h-64fc-37mp ("Minerva" ECDSA timing
# side-channel). NOT EXPLOITABLE in our usage, and no upstream fix exists:
#   * Minerva affects ECDSA signing/keygen only -- NOT verification.
#   * We sign/verify JWTs exclusively with HS256 (HMAC); decode pins
#     algorithms=["HS256"] (no algorithm-confusion path), and no EC algorithms
#     (ES256/384/512) are used anywhere. ecdsa is a dormant transitive dep of
#     python-jose and is never imported on our code path.
#   * python-jose[cryptography] routes any EC op through the constant-time
#     `cryptography` backend, not `ecdsa`.
#   * Upstream is WONTFIX (side channels are out of scope for a pure-Python
#     lib; no patched release exists -- latest 0.19.2 is still flagged).
# Real fix = migrate python-jose -> PyJWT (drops the dep). Tracked in #673.
# ignoreUntil forces re-evaluation (revisit sooner if we ever adopt an
# EC-based JWT algorithm, which would change the exposure).
[[IgnoredVulns]]
id = "GHSA-wj6h-64fc-37mp"
ignoreUntil = 2027-01-01T00:00:00Z
reason = "Not exploitable: HS256/HMAC only, no ECDSA signing; ecdsa is a dormant transitive dep (python-jose[cryptography] uses the cryptography backend). Upstream WONTFIX (no patched release). Real fix = migrate to PyJWT, tracked in #673."

# python-jose -- GHSA-3qf3-8w2g-rqmx (algorithm confusion through a
# DER-encoded asymmetric public key used as an HMAC secret). No patched release
# exists. This path is unreachable in Lumose:
#   * access and refresh token decode explicitly allow only the configured
#     HS256 algorithm (src/core/security.py);
#   * the application secret is a symmetric deployment secret, never an
#     asymmetric public key; and
#   * no RS*/ES* JWT algorithms are configured or accepted.
# Real fix = migrate python-jose -> PyJWT. Tracked in #673.
[[IgnoredVulns]]
id = "GHSA-3qf3-8w2g-rqmx"
ignoreUntil = 2027-01-01T00:00:00Z
reason = "Not exploitable: access and refresh decoders explicitly allow only HS256 and verify with the symmetric application secret; no asymmetric JWT public key or RS*/ES* algorithm enters this path. No patched python-jose release exists; migration to PyJWT is tracked in #673."

# postcss 8.4.31 -- nested inside next (apps/web/node_modules/next/node_modules/postcss).
# Next bundles its own postcss for build-time CSS compilation. The CVE is XSS via
# unescaped </style> in CSS Stringify Output -- requires processing untrusted CSS
# through postcss with the output rendered to a user. Our app does not process user
# CSS through next's build pipeline; only static authored CSS files are compiled.
# next's overrides cannot be applied without breaking next's internal version pin.
# Top-level postcss is already at 8.5.23.
# TODO: Remove these suppressions after Next.js bundles postcss 8.5.18 or later.
[[IgnoredVulns]]
id = "GHSA-qx2v-qp2m-jg93"
ignoreUntil = 2026-09-30T00:00:00Z
reason = "Nested only inside Next.js; build-time CSS compilation processes trusted repository CSS, and top-level postcss is patched to 8.5.23."

