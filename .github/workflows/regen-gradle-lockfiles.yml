name: Regenerate Gradle Lockfiles

# Renovate runs inside the renovate/renovate container (see renovate.yml),
# which has no Android SDK, so it cannot execute the AGP build to refresh the
# committed gradle.lockfile files when it bumps a Gradle dependency. With
# dependency locking enforced, a stale lockfile fails CI on the Renovate PR.
# This workflow closes that loop: on Renovate Gradle PRs it regenerates the
# lockfiles on a runner that has the Android SDK and pushes the refreshed
# files back to the PR branch. The push retriggers this workflow once via
# `synchronize`; the second run produces no diff and exits without pushing.
#
# See docs/dev/security-testing.md "Dependency Vulnerability Scanning" for why
# the lockfiles exist (OSV-Scanner reads only gradle.lockfile, not
# build.gradle.kts or the version catalog).

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/mobile/gradle/libs.versions.toml'
      - 'apps/mobile/gradle/wrapper/gradle-wrapper.properties'
      - 'apps/mobile/**/build.gradle.kts'
      - 'plugins/**/build.gradle.kts'
      - 'tools/medtronic-ble-spike/build.gradle.kts'

# The gradle steps execute build scripts from the PR branch; keep the ambient
# token read-only. The push uses an app token minted only after Gradle exits.
permissions:
  contents: read

concurrency:
  group: regen-gradle-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Refresh gradle.lockfile files
    # Hard guards (mirror auto-merge-renovate.yml):
    #   1. PR author is glycemicgpt-renovate (cannot be impersonated).
    #   2. Same-repo head -- this job pushes back to the branch, never to forks.
    #   3. Renovate branch prefix, defense in depth.
    if: |
      github.event.pull_request.user.login == 'glycemicgpt-renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Regenerate lockfiles
        run: |
          (cd apps/mobile && ./gradlew resolveAndLockAll --write-locks --console=plain)
          (cd tools/medtronic-ble-spike && ./gradlew dependencies --write-locks --console=plain > /dev/null)

      - name: Detect lockfile changes
        id: diff
        run: |
          CHANGED=$(git status --porcelain -- '*gradle.lockfile' | wc -l)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          git status --porcelain -- '*gradle.lockfile'

      - name: Generate token for glycemicgpt-renovate
        if: steps.diff.outputs.changed != '0'
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Commit and push refreshed lockfiles
        if: steps.diff.outputs.changed != '0'
        env:
          PUSH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "glycemicgpt-renovate[bot]"
          git config user.email "glycemicgpt-renovate[bot]@users.noreply.github.com"
          git add -- '*gradle.lockfile'
          git commit -m "chore(deps): refresh gradle lockfiles"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${HEAD_REF}"
