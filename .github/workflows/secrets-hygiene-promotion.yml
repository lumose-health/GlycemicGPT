name: Secrets Hygiene Audit (promotion)

# Unconditional trigger half of the secrets-hygiene split (see
# secrets-hygiene.yml for the audit job, its invariants, and why the
# split exists). This file's only job is the trigger: every push to
# main -- promotion, version-bump, or changelog commit alike -- calls
# the shared audit workflow, regardless of which paths changed, so the
# ISOLATION_REVIEWERLESS_ENVS legs re-verify at each promotion moment
# rather than only on the weekly schedule. develop is deliberately not
# listed here: ordinary development pushes stay on secrets-hygiene.yml's
# paths-filtered push:develop trigger.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Secret Invariant Audit
    uses: ./.github/workflows/secrets-hygiene.yml
    secrets:
      SECURITY_APP_ID: ${{ secrets.SECURITY_APP_ID }}
      SECURITY_APP_PRIVATE_KEY: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
